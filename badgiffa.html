<title>Badgiffa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    --paper: #f3f1ea;
    --paper-2: #e9e6dc;
    --ink: #2b2a27;
    --ink-soft: #6b6862;
    --line: #cfcbbf;
    --crayon: #e0532c;
    --crayon-ink: #ffffff;
    --bubble: #ffffff;
    --bubble-ink: #22211f;
    --stage: #ffffff;
    --field: #ffffff;
    --shadow: rgba(43, 42, 39, .18);
    --focus: #2f6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d201e;
      --paper-2: #262a27;
      --ink: #ecebe4;
      --ink-soft: #a6a59c;
      --line: #3b403c;
      --crayon: #f0673f;
      --crayon-ink: #1a1a18;
      --bubble: #f4f2ea;
      --bubble-ink: #22211f;
      --stage: #ffffff;
      --field: #141715;
      --shadow: rgba(0, 0, 0, .5);
      --focus: #7fb0ff;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d201e;
    --paper-2: #262a27;
    --ink: #ecebe4;
    --ink-soft: #a6a59c;
    --line: #3b403c;
    --crayon: #f0673f;
    --crayon-ink: #1a1a18;
    --bubble: #f4f2ea;
    --bubble-ink: #22211f;
    --stage: #ffffff;
    --field: #141715;
    --shadow: rgba(0, 0, 0, .5);
    --focus: #7fb0ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Share Tech Mono", "Courier New", monospace;
    font-size: 15px;
    min-height: 100vh;
    min-height: 100dvh;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header {
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: center;
  }
  .hint {
    margin: 0;
    color: var(--ink-soft);
    font-size: .85rem;
    text-align: center;
  }
  /* Title sits inside the stage, centered in the white band above the drawing.
     The stage is always white, so the ink is fixed rather than themed. */
  .title {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--title-top, 5%);
    margin: 0;
    padding-inline: 24px;
    text-align: center;
    font-family: "Orbitron", "Eurostile", "Share Tech Mono", monospace;
    font-weight: 700;
    font-size: clamp(1.7rem, 8.5vw, 2.5rem);
    line-height: 1.05;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #22211f;
    text-wrap: balance;
    pointer-events: none;
    z-index: 2;
  }
  .stage.editing .title { opacity: .35; }

  /* The phone-sized stage: iPhone portrait screen ratio */
  .stage {
    position: relative;
    width: min(100%, 430px, calc((100dvh - 150px) * 9 / 19.5));
    aspect-ratio: 9 / 19.5;
    max-width: 100%;
    border-radius: 42px;
    background: var(--stage);
    box-shadow: 0 18px 40px -18px var(--shadow), 0 0 0 1px var(--line);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  .dog {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: 50% 85%;
    will-change: transform;
  }
  .stage[data-fit="fit"] .dog { object-fit: contain; }
  .jaw { transform-origin: 50% 0; }
  .ear { pointer-events: none; }
  .ear.wiggle { animation: wiggle .75s ease-in-out 1; }
  @keyframes wiggle {
    0%   { transform: rotate(0); }
    15%  { transform: rotate(-6deg); }
    35%  { transform: rotate(5deg); }
    55%  { transform: rotate(-4deg); }
    75%  { transform: rotate(2.5deg); }
    90%  { transform: rotate(-1.2deg); }
    100% { transform: rotate(0); }
  }
  .jaw.chomp { animation: chomp .22s ease-in-out infinite alternate; }
  @keyframes chomp {
    from { transform: translateY(0); }
    to   { transform: translateY(var(--jaw-gap, 14px)); }
  }
  .stage.editing { cursor: crosshair; }
  .stage.editing .jaw { opacity: .55; }
  .trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .trace polygon { fill: rgba(224, 83, 44, .18); stroke: #e0532c; stroke-width: 3; stroke-linejoin: round; }
  .trace polyline { fill: none; stroke: #e0532c; stroke-width: 3; stroke-dasharray: 8 6; }
  .trace circle { fill: #fff; stroke: #e0532c; stroke-width: 3; pointer-events: all; cursor: grab; touch-action: none; }
  .trace circle.first { fill: #e0532c; }
  .toolbar[hidden] { display: none; }

  /* Empty state: a doodle placeholder until a photo is added */
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    color: var(--ink-soft);
    background:
      radial-gradient(circle at 50% 40%, var(--paper-2) 0, transparent 60%),
      var(--stage);
  }
  .empty[hidden], .dog[hidden], .trace[hidden] { display: none; }
  .empty svg { width: 58%; max-width: 220px; height: auto; color: var(--ink); }
  .empty p {
    margin: 0;
    font-family: "Orbitron", "Eurostile", "Share Tech Mono", monospace;
    font-size: 1.6rem;
    line-height: 1.1;
    color: var(--ink);
    text-wrap: balance;
  }
  .empty small { font-size: .85rem; }

  /* Speech bubble */
  .bubble {
    position: absolute;
    left: 50%;
    top: var(--bubble-top, 14%);
    transform: translate(-50%, 0) scale(.6);
    max-width: 78%;
    padding: 12px 18px 14px;
    background: var(--bubble);
    color: var(--bubble-ink);
    border-radius: 22px;
    font-family: "Orbitron", "Eurostile", "Share Tech Mono", monospace;
    font-weight: 700;
    font-size: clamp(.95rem, 4.2vw, 1.25rem);
    line-height: 1.25;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 10px 26px -10px var(--shadow), 0 0 0 2px var(--bubble-ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .28s cubic-bezier(.34, 1.56, .64, 1);
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -14px;
    width: 18px;
    height: 18px;
    background: var(--bubble);
    border-right: 2px solid var(--bubble-ink);
    border-bottom: 2px solid var(--bubble-ink);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 4px 0;
  }
  .bubble { z-index: 3; }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .toolbar {
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn {
    appearance: none;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: .9rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
  }
  .btn.primary { background: var(--crayon); border-color: var(--crayon); color: var(--crayon-ink); }
  .btn:active { transform: translateY(1px); }
  .status {
    width: 100%;
    max-width: 460px;
    min-height: 1.2em;
    margin: 0;
    text-align: center;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  /* Settings sheet */
  dialog {
    border: 0;
    border-radius: 22px;
    background: var(--paper);
    color: var(--ink);
    padding: 20px;
    width: min(92vw, 420px);
    box-shadow: 0 24px 60px -20px var(--shadow), 0 0 0 1px var(--line);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 {
    margin: 0 0 12px;
    font-family: "Orbitron", "Eurostile", "Share Tech Mono", monospace;
    font-size: 1.15rem;
    line-height: 1.2;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label {
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .field input, .field textarea, .field select {
    font: inherit;
    color: #22211f;
    -webkit-text-fill-color: #22211f;
    caret-color: #22211f;
    background: #ffffff;
    border: 1px solid var(--line);
    color-scheme: light;
    border-radius: 10px;
    padding: 9px 11px;
    width: 100%;
  }
  .field input::placeholder, .field textarea::placeholder { color: #8a877f; -webkit-text-fill-color: #8a877f; }
  .field select option { color: #22211f; background: #ffffff; }
  .field textarea { min-height: 130px; resize: vertical; line-height: 1.4; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .jaw.chomp { animation-duration: .5s; }
    .ear.wiggle { animation-duration: 1.2s; }
    .bubble { transition: opacity .15s ease; transform: translate(-50%, 0) scale(1); }
  }
</style>

<header>
  <p class="hint" id="hint">Tap the dog to make it talk. Hold for tools.</p>
</header>

<div class="stage" id="stage" data-fit="fit" role="button" tabindex="0" aria-label="Tap to make the dog talk">
  <h1 class="title" id="title">Cyber Buff</h1>
  <img class="dog" id="dog" alt="Your dog drawing" hidden>
  <img class="dog ear" id="earL" alt="" aria-hidden="true" hidden>
  <img class="dog ear" id="earR" alt="" aria-hidden="true" hidden>
  <img class="dog jaw" id="jaw" alt="" aria-hidden="true" hidden>
  <svg class="trace" id="trace" aria-hidden="true" hidden></svg>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="empty" id="empty">
    <svg viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M60 78c-4-22 10-40 40-40s44 18 40 40c6 8 8 22 2 34-8 16-30 24-42 24s-34-8-42-24c-6-12-4-26 2-34z"/>
      <path d="M62 76c-14-6-30-4-38 6 8 14 24 20 36 14"/>
      <path d="M138 76c14-6 30-4 38 6-8 14-24 20-36 14"/>
      <circle cx="84" cy="88" r="3" fill="currentColor"/>
      <circle cx="116" cy="88" r="3" fill="currentColor"/>
      <path d="M92 106c4-4 12-4 16 0-2 6-6 8-8 8s-6-2-8-8z" fill="currentColor"/>
      <path d="M100 114v8m0 0c-6 6-12 4-14 0m14 0c6 6 12 4 14 0"/>
      <path d="M70 52c-6-14 2-26 10-28 2 10 6 16 12 20"/>
      <path d="M130 52c6-14-2-26-10-28-2 10-6 16-12 20"/>
    </svg>
    <p>Add your dog drawing</p>
    <small>Tap here to pick a photo</small>
  </div>
  <div class="bubble" id="bubble" aria-live="polite"></div>
</div>

<div class="toolbar" id="mainBar" hidden>
  <label class="btn primary" for="file" id="fileBtn">Add photo</label>
  <input class="file-input" type="file" id="file" accept="image/*">
  <button class="btn" type="button" id="jawBtn">Set jaw</button>
  <button class="btn" type="button" id="fitBtn">Fit whole drawing</button>
  <button class="btn" type="button" id="settingsBtn">Lines &amp; voice</button>
</div>
<div class="toolbar" id="editBar" hidden>
  <button class="btn" type="button" id="undoBtn">Undo point</button>
  <button class="btn" type="button" id="clearBtn">Clear</button>
  <button class="btn" type="button" id="cancelEditBtn">Cancel</button>
  <button class="btn primary" type="button" id="doneBtn">Done</button>
</div>
<p class="status" id="status"></p>

<dialog id="settings">
  <h2>Lines &amp; voice</h2>
  <form method="dialog" id="settingsForm">
    <div class="field">
      <label for="name">Dog's name</label>
      <input id="name" type="text" maxlength="30" placeholder="Badgiffa">
    </div>
    <div class="field">
      <label for="lines">What it says (one line each)</label>
      <textarea id="lines"></textarea>
    </div>
    <div class="field">
      <label for="voiceStyle">Voice</label>
      <select id="voiceStyle">
        <option value="robot" selected>Robot (Soundwave)</option>
        <option value="small">Small dog (high)</option>
        <option value="medium">Medium dog</option>
        <option value="big">Big dog (low)</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var DEFAULT_LINES = [
    "Homework first. Then fetch.",
    "Read it twice. Understand it once.",
    "Mistakes are data. Learn from them.",
    "Ask the question nobody asks.",
    "Sleep is part of studying.",
    "Math is just patterns. Sniff them out.",
    "Take notes by hand. It sticks.",
    "Teach it to a friend. Then you know it."
  ];
  // Jaw outline of the built-in drawing, traced from the owner's red line
  // (fractions of the image). "Set jaw" lets the owner redraw it.
  var DRAWING_JAW = [
    [0.4224, 0.6506], [0.4255, 0.6454], [0.4502, 0.6485], [0.4779, 0.6711], [0.4995, 0.6598], [0.5026, 0.6393],
    [0.5118, 0.6362], [0.5889, 0.6876], [0.6105, 0.6917], [0.6166, 0.702], [0.6413, 0.7174], [0.6629, 0.7246],
    [0.6845, 0.7379], [0.7122, 0.7359], [0.7338, 0.7246], [0.74, 0.7163], [0.7585, 0.7091], [0.8078, 0.7081],
    [0.8325, 0.702], [0.8386, 0.704], [0.8417, 0.7091], [0.8541, 0.7585], [0.8541, 0.8016], [0.851, 0.8099],
    [0.8448, 0.814], [0.7677, 0.851], [0.7585, 0.8602], [0.7369, 0.8726], [0.7153, 0.8798], [0.6906, 0.8777],
    [0.6475, 0.8623], [0.6136, 0.8438], [0.5519, 0.7821], [0.5365, 0.7811], [0.5087, 0.7616], [0.5026, 0.741],
    [0.4841, 0.7246], [0.4687, 0.7287], [0.4502, 0.7235], [0.4255, 0.7071], [0.4224, 0.6927]
  ];

  // Ears of the built-in drawing (fractions of the image). Tap an ear and it
  // swings about its base.
  // Left ear: the leaf only, cut along its yellow rim; it hinges where the
  // rim meets the cable that runs to the body, and the cable stays put.
  // Right ear: cut along the line where it sits on the head block, hinged at
  // the middle of that line.
  var DRAWING_EARS = [
    { pivot: [0.306, 0.468], pts: [
      [0.087, 0.198], [0.107, 0.201], [0.137, 0.244], [0.167, 0.256], [0.192, 0.274], [0.218, 0.308],
      [0.239, 0.342], [0.274, 0.380], [0.295, 0.423], [0.308, 0.453], [0.311, 0.466], [0.297, 0.476],
      [0.262, 0.475], [0.225, 0.471], [0.195, 0.467], [0.160, 0.457], [0.128, 0.427], [0.098, 0.385],
      [0.077, 0.320], [0.073, 0.256], [0.077, 0.222] ] },
    { pivot: [0.708, 0.388], pts: [
      [0.872, 0.085], [0.838, 0.094], [0.804, 0.111], [0.778, 0.115], [0.752, 0.132], [0.726, 0.167],
      [0.701, 0.184], [0.684, 0.197], [0.667, 0.226], [0.645, 0.269], [0.637, 0.295], [0.650, 0.325],
      [0.667, 0.350], [0.676, 0.378], [0.694, 0.392], [0.712, 0.394], [0.730, 0.390], [0.748, 0.372],
      [0.761, 0.359], [0.786, 0.325],
      [0.799, 0.282], [0.812, 0.239], [0.829, 0.197], [0.855, 0.154], [0.872, 0.120], [0.881, 0.094] ] }
  ];
  // Touch spots of the built-in drawing (fractions of the image).
  var DRAWING_SPOTS = {
    // ends of the wiry hairs: each lights up like a little bulb
    hairTips: [
      [0.308, 0.278], [0.350, 0.315], [0.364, 0.192], [0.395, 0.249], [0.395, 0.115], [0.418, 0.155],
      [0.433, 0.250], [0.439, 0.201], [0.480, 0.139], [0.485, 0.296], [0.492, 0.221], [0.504, 0.109],
      [0.536, 0.145], [0.555, 0.119], [0.585, 0.107], [0.614, 0.120], [0.626, 0.140], [0.636, 0.182],
      [0.666, 0.120], [0.680, 0.152]
    ],
    hair: [[0.285, 0.085], [0.705, 0.085], [0.705, 0.215], [0.640, 0.250], [0.560, 0.290], [0.470, 0.330], [0.360, 0.345], [0.285, 0.320]],
    // the two red pupils; the lenses face right, so the beams go that way
    eyes: [[0.497, 0.380], [0.619, 0.332]],
    eyeRadius: 0.075,
    laserDir: [1, -0.12],
    nose: [[0.640, 0.520], [0.720, 0.490], [0.820, 0.500], [0.850, 0.580], [0.830, 0.680], [0.740, 0.700], [0.650, 0.660]],
    nostrils: [[0.727, 0.615], [0.765, 0.665]]
  };
  var VOICES = {
    // Intergalactic-style: the old MacinTalk "Fred" voice where it exists (iOS/macOS),
    // flat low pitch, word-by-word delivery, plus a vocoder-like buzz under it.
    robot:  { vocoder: true, pitch: 0.35, rate: 0.88, staccato: true,  buzz: true, pref: /^fred$|^fred |zarvox|trinoids|robot|cellos|bahh|albert|eddy|whisper/i },
    small:  { pitch: 1.6,  rate: 1.05, staccato: false, pref: /samantha|daniel|karen|google us english/i },
    medium: { pitch: 1.2,  rate: 1.05, staccato: false, pref: /samantha|daniel|karen|google us english/i },
    big:    { pitch: 0.7,  rate: 1.0,  staccato: false, pref: /samantha|daniel|karen|google us english/i }
  };
  var state = { name: "Badgiffa", lines: DEFAULT_LINES.slice(), voiceStyle: "robot", fit: "fit", jawPts: null, photoId: null, photoData: null };
  var db = null, assets = null, docRef = null;
  var lastIndex = -1;

  var stage = document.getElementById("stage");
  var dog = document.getElementById("dog");
  var jaw = document.getElementById("jaw");
  var ears = [document.getElementById("earL"), document.getElementById("earR")];
  var fx = document.getElementById("fx");
  var trace = document.getElementById("trace");
  var empty = document.getElementById("empty");
  var bubble = document.getElementById("bubble");
  var fileInput = document.getElementById("file");
  var fitBtn = document.getElementById("fitBtn");
  var status = document.getElementById("status");
  var mainBar = document.getElementById("mainBar");
  var editBar = document.getElementById("editBar");
  var settings = document.getElementById("settings");
  var nameInput = document.getElementById("name");
  var linesInput = document.getElementById("lines");
  var voiceInput = document.getElementById("voiceStyle");
  var hint = document.getElementById("hint");
  var title = document.getElementById("title");

  function say(msg) { status.textContent = msg || ""; }
  function usingDrawing() { return !state.photoId && !state.photoData; }
  function currentSrc() { return state.photoId ? "/_blob/" + state.photoId : (state.photoData || "dog.jpg"); }
  function earDefs() { return usingDrawing() ? DRAWING_EARS : []; }
  function spots() { return usingDrawing() ? DRAWING_SPOTS : null; }
  function jawPts() {
    if (state.jawPts && state.jawPts.length >= 3) return state.jawPts;
    return usingDrawing() ? DRAWING_JAW : [[0, 0.57], [1, 0.57], [1, 1], [0, 1]];
  }

  /* ---------- source image and the two cut layers ---------- */
  var source = null;        // decoded source image
  var sourceSrc = null;
  var interior = null;      // Uint8Array: 1 where the pixel belongs to the drawing (not outside white)
  var urls = [];

  function loadSource(src) {
    if (sourceSrc === src && source) { buildLayers(); return; }
    var img = new Image();
    img.onload = function () {
      source = img; sourceSrc = src; interior = null;
      buildLayers();
    };
    img.onerror = function () { say("Couldn't load the picture."); };
    img.src = src;
  }

  // Flood-fill near-white from the border so white paper around the drawing
  // is never part of the jaw, but white inside the drawing still is.
  function computeInterior(ctx, w, h) {
    var data = ctx.getImageData(0, 0, w, h).data;
    var seen = new Uint8Array(w * h);
    var stack = [];
    function white(i) { return data[i * 4] > 222 && data[i * 4 + 1] > 222 && data[i * 4 + 2] > 222; }
    function push(i) { if (!seen[i] && white(i)) { seen[i] = 1; stack.push(i); } }
    for (var x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
    for (var y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
    while (stack.length) {
      var i = stack.pop(), px = i % w, py = (i - px) / w;
      if (px > 0) push(i - 1);
      if (px < w - 1) push(i + 1);
      if (py > 0) push(i - w);
      if (py < h - 1) push(i + w);
    }
    var inside = new Uint8Array(w * h);
    for (var k = 0; k < inside.length; k++) inside[k] = seen[k] ? 0 : 1;
    return inside;
  }

  function buildLayers() {

  /* ---------- jaw editor: tap points around the jaw ---------- */

    while (trace.firstChild) trace.removeChild(trace.firstChild);
    var px = draft.map(function (p) { return [r.left + p[0] * r.w, r.top + p[1] * r.h]; });

  /* ---------- talking ---------- */

  function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }

  // Old light bulbs humming: a 60 Hz mains drone with its harmonics and a
  // faint filament sizzle, swelling as the bulbs come on and dying with them.
  var humNodes = null;
  function bulbHum(seconds) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === "suspended") actx.resume();
      stopHum();
      var t = actx.currentTime, oscs = [];
      var out = actx.createGain();
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(1, t + 0.45);
      out.gain.setValueAtTime(1, t + seconds - 0.7);
      out.gain.linearRampToValueAtTime(0, t + seconds);
      out.connect(actx.destination);
      [[60, 0.05, "sine"], [120, 0.035, "sine"], [180, 0.02, "triangle"], [240, 0.012, "sine"]].forEach(function (d) {
        var o = actx.createOscillator(); o.type = d[2]; o.frequency.value = d[0];
        var g = actx.createGain(); g.gain.value = d[1];
        o.connect(g); g.connect(out); o.start(t); o.stop(t + seconds + 0.1); oscs.push(o);
      });
      // slow wobble on the hum, like a loose fixture
      var lfo = actx.createOscillator(); lfo.frequency.value = 5.5;
      var lfoG = actx.createGain(); lfoG.gain.value = 0.25;
      lfo.connect(lfoG); lfoG.connect(out.gain); lfo.start(t); lfo.stop(t + seconds + 0.1); oscs.push(lfo);
      // filament sizzle: quiet noise through a narrow high band
      var len = Math.ceil(actx.sampleRate * (seconds + 0.2));
      var buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (Math.random() < 0.02 ? 1 : 0.25);
      var noise = actx.createBufferSource(); noise.buffer = buf;
      var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3800; bp.Q.value = 2.5;
      var ng = actx.createGain(); ng.gain.value = 0.012;
      noise.connect(bp); bp.connect(ng); ng.connect(out); noise.start(t); noise.stop(t + seconds + 0.1);
      humNodes = { out: out, oscs: oscs.concat([noise]) };
      setTimeout(function () { if (humNodes && humNodes.out === out) humNodes = null; }, (seconds + 0.3) * 1000);
    } catch (e) {}
  }
  function stopHum() {
    if (!humNodes || !actx) return;
    var n = humNodes; humNodes = null;
    var t = actx.currentTime;
    n.out.gain.cancelScheduledValues(t);
    n.out.gain.setValueAtTime(n.out.gain.value, t);
    n.out.gain.linearRampToValueAtTime(0, t + 0.1);
    n.oscs.forEach(function (o) { try { o.stop(t + 0.12); } catch (e) {} });
  }

  // Hair: every tip glows on in a scatter, flickers like a filament, then fades.
  function lightBulbs(tips) {
    var order = tips.map(function (p, i) { return { p: p, delay: Math.random() * 0.5, seed: i * 7.3 }; });
    bulbHum(0.5 + 1.5 + 0.7);   // last bulb's delay + hold + fade
    addEffect({ draw: function (ctx, r, t) {
      var alive = false, R = r.w * 0.032;
      order.forEach(function (b) {
        var lt = t - b.delay;
        if (lt < 0) { alive = true; return; }
        var on = ease(lt / 0.15) * (1 - ease((lt - 1.5) / 0.7));
        if (on <= 0.001) return;
        alive = true;
        var flick = 0.85 + 0.15 * Math.sin(lt * 37 + b.seed) * Math.sin(lt * 11 + b.seed);
        var a = on * flick, c = toStage(r, b.p);
        var g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], R);
        g.addColorStop(0, "rgba(255, 244, 190, " + (0.95 * a) + ")");
        g.addColorStop(0.35, "rgba(255, 208, 90, " + (0.55 * a) + ")");
        g.addColorStop(1, "rgba(255, 180, 40, 0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(c[0], c[1], R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 235, " + a + ")";
        ctx.beginPath(); ctx.arc(c[0], c[1], R * 0.28, 0, Math.PI * 2); ctx.fill();
      });
      return alive;
    } });
  }

  // Thick goo: slow wet glorps, one per drop, each a pitch-sagging blip with
  // a bubbly wobble and a low-passed squelch of noise underneath.
  function gooSound(times) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime;
      var len = Math.ceil(actx.sampleRate * 0.35), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
      times.forEach(function (d, k) {
        var t = t0 + d, v = 1 - k * 0.2;
        // the glorp: a sine that sags in pitch with a quick wobble
        var o = actx.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(260 + Math.random() * 60, t);
        o.frequency.exponentialRampToValueAtTime(90, t + 0.28);
        var wob = actx.createOscillator(); wob.frequency.value = 22 + Math.random() * 8;
        var wobG = actx.createGain(); wobG.gain.value = 35;
        wob.connect(wobG); wobG.connect(o.frequency);
        var g = actx.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22 * v, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 4;
        o.connect(lp); lp.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + 0.36); wob.start(t); wob.stop(t + 0.36);
        // the squelch: dark noise, swept low-pass
        var n = actx.createBufferSource(); n.buffer = buf;
        var nf = actx.createBiquadFilter(); nf.type = "lowpass"; nf.Q.value = 6;
        nf.frequency.setValueAtTime(1200, t); nf.frequency.exponentialRampToValueAtTime(200, t + 0.3);
        var ng = actx.createGain(); ng.gain.value = 0.16 * v;
        n.connect(nf); nf.connect(ng); ng.connect(actx.destination); n.start(t);
      });
    } catch (e) {}
  }

  // Nose: a few black drops run down from the nostrils and thin out. Not a flood.
  function noseDrips(nostrils) {
    var drops = [];
    for (var i = 0; i < 3; i++) {
      var n = nostrils[i % nostrils.length];
      drops.push({ x: n[0] + (Math.random() - 0.5) * 0.012, y0: n[1], delay: i * 0.28 + Math.random() * 0.2,
                   speed: 0.10 + Math.random() * 0.05, len: 0.16 + Math.random() * 0.12, w: 0.006 + Math.random() * 0.003 });
    }
    gooSound(drops.map(function (d) { return d.delay; }));
    addEffect({ draw: function (ctx, r, t) {
      var alive = false;
      drops.forEach(function (d) {
        var lt = t - d.delay;
        if (lt < 0) { alive = true; return; }
        var fall = Math.min(d.len, d.speed * lt + 0.5 * 0.12 * lt * lt);
        var fade = 1 - ease((lt - 2.4) / 0.9);
        if (fade <= 0.001) return;
        alive = true;
        var top = toStage(r, [d.x, d.y0]), tip = toStage(r, [d.x, d.y0 + fall]);
        var w = d.w * r.w;
        ctx.strokeStyle = "rgba(20, 14, 12, " + (0.95 * fade) + ")";
        ctx.lineCap = "round";
        ctx.lineWidth = w * 0.55;
        ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(tip[0], tip[1]); ctx.stroke();
        ctx.fillStyle = "rgba(20, 14, 12, " + (0.98 * fade) + ")";
        ctx.beginPath(); ctx.ellipse(tip[0], tip[1] - w * 0.6, w * 0.9, w * 1.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, " + (0.35 * fade) + ")";
        ctx.beginPath(); ctx.arc(tip[0] - w * 0.3, tip[1] - w * 1.1, w * 0.25, 0, Math.PI * 2); ctx.fill();
      });
      return alive;
    } });
  }

  // Eyes: both pupils fire a red beam out of the picture, with a flash at the eye.
  function shootLasers(eyes, dir) {
    var L = Math.hypot(dir[0], dir[1]), ux = dir[0] / L, uy = dir[1] / L;
    laserSound();
    addEffect({ draw: function (ctx, r, t) {
      var life = 0.55;
      if (t > life) return false;
      var grow = ease(t / 0.08), fade = 1 - ease((t - 0.3) / 0.25);
      var reach = Math.hypot(r.W, r.H) * grow;
      eyes.forEach(function (e) {
        var a = toStage(r, e), b = [a[0] + ux * reach, a[1] + uy * reach];
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(255, 40, 40, " + fade + ")"; ctx.shadowBlur = r.w * 0.03;
        ctx.strokeStyle = "rgba(255, 40, 40, " + (0.85 * fade) + ")"; ctx.lineWidth = r.w * 0.022;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255, 235, 235, " + fade + ")"; ctx.lineWidth = r.w * 0.007;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        var g = ctx.createRadialGradient(a[0], a[1], 0, a[0], a[1], r.w * 0.06);
        g.addColorStop(0, "rgba(255, 255, 255, " + fade + ")");
        g.addColorStop(0.4, "rgba(255, 80, 60, " + (0.7 * fade) + ")");
        g.addColorStop(1, "rgba(255, 40, 40, 0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(a[0], a[1], r.w * 0.06, 0, Math.PI * 2); ctx.fill();
      });
      return true;
    } });
  }
  function laserSound() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === "suspended") actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.3);
      var g = actx.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.35);
    } catch (e) {}
  }
  function hitSpot(f) {
    var sp = spots();
    if (!sp) return false;
    for (var i = 0; i < sp.eyes.length; i++) {
      if (Math.hypot(f[0] - sp.eyes[i][0], f[1] - sp.eyes[i][1]) < sp.eyeRadius) { shootLasers(sp.eyes, sp.laserDir); return true; }
    }
    if (inPoly(f, sp.nose)) { noseDrips(sp.nostrils); return true; }
    if (inPoly(f, sp.hair)) { lightBulbs(sp.hairTips); return true; }
    return false;
  }

  function inPoly(pt, pts) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  // Floppy dog-ear flaps: one soft leathery slap per swing of the wiggle
  // (timed to its keyframes), each a low thump plus a puff of filtered noise.
  function earFlapSound() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime;
      var len = Math.ceil(actx.sampleRate * 0.12), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      [[0.11, 1], [0.26, 0.85], [0.41, 0.7], [0.56, 0.5], [0.68, 0.3]].forEach(function (f) {
        var t = t0 + f[0], v = f[1];
        var n = actx.createBufferSource(); n.buffer = buf; n.playbackRate.value = 0.9 + Math.random() * 0.25;
        var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800; lp.Q.value = 0.7;
        var ng = actx.createGain(); ng.gain.value = 0.18 * v;
        n.connect(lp); lp.connect(ng); ng.connect(actx.destination); n.start(t);
        var o = actx.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.09);
        var g = actx.createGain(); g.gain.setValueAtTime(0.14 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.12);
      });
    } catch (e) {}
  }
  function wiggleEar(i) {
    var img = ears[i];
    img.classList.remove("wiggle");
    void img.offsetWidth;   // restart the animation on a quick second tap
    img.classList.add("wiggle");
    earFlapSound();
  }
  ears.forEach(function (img) { img.addEventListener("animationend", function () { img.classList.remove("wiggle"); }); });

  stage.addEventListener("click", function (e) {
    if (held) { held = false; return; }
    if (!editing && empty.hidden) {
      var f = toFraction(e.clientX, e.clientY), defs = earDefs();
      for (var k = 0; k < defs.length; k++) {
        if (inPoly(f, defs[k].pts)) { wiggleEar(k); return; }
      }
      if (hitSpot(f)) return;
    }
    if (editing) {
      if (dragging || (e.target && e.target.tagName === "circle")) return;
      draft.push(toFraction(e.clientX, e.clientY));
      drawTrace();
      return;
    }
    if (!empty.hidden) { fileInput.click(); return; }
    talk();
  });
  stage.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!editing) talk(); }
  });

  /* ---------- photo ---------- */
  var IPHONE_W = 1170, IPHONE_H = 2532;
  function resizeToPhone(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var scale = Math.min(1, IPHONE_W / img.naturalWidth, IPHONE_H / img.naturalHeight);
        var w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("encode")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  function blobToDataUrl(blob) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.readAsDataURL(blob);
    });
  }

  fileInput.addEventListener("change", async function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    say("Sizing the photo for iPhone…");
    try {
      var blob = await resizeToPhone(file);
      var oldId = state.photoId;
      state.jawPts = null;
      if (assets && docRef) {
        say("Saving…");
        var up = await assets.upload(blob, { type: "image/jpeg" });
        state.photoId = up.id;
        state.photoData = null;
        await persist();
        if (oldId && oldId !== up.id) { try { await assets.delete(oldId); } catch (e) {} }
        say("Saved. Use Set jaw to mark the part that moves.");
      } else {
        state.photoData = await blobToDataUrl(blob);
        state.photoId = null;
        persistLocal();
        say("Saved on this device. Use Set jaw to mark the part that moves.");
      }
      render();
    } catch (err) {
      say("Couldn't use that photo. Try another one.");
    }
    fileInput.value = "";
  });

  fitBtn.addEventListener("click", function () {
    state.fit = state.fit === "cover" ? "fit" : "cover";
    stage.dataset.fit = state.fit;
    fitBtn.textContent = state.fit === "cover" ? "Fit whole drawing" : "Fill the screen";
    layoutJaw();
    persist();
  });

  /* ---------- settings ---------- */
  document.getElementById("settingsBtn").addEventListener("click", function () {
    nameInput.value = state.name;
    linesInput.value = state.lines.join("\n");
    voiceInput.value = state.voiceStyle;
    settings.showModal();
  });
  document.getElementById("cancelBtn").addEventListener("click", function () { settings.close(); });
  document.getElementById("settingsForm").addEventListener("submit", function () {
    state.name = nameInput.value.trim() || "Badgiffa";
    state.lines = linesInput.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!state.lines.length) state.lines = DEFAULT_LINES.slice();
    state.voiceStyle = VOICES[voiceInput.value] ? voiceInput.value : "robot";
    hint.textContent = "Tap " + state.name + " to make it talk. Hold for tools.";
    persist();
  });

  /* ---------- persistence ---------- */
  function snapshot() {
    return { name: state.name, lines: state.lines, voiceStyle: state.voiceStyle, fit: state.fit, jawPts: state.jawPts, photoId: state.photoId };
  }
  function persistLocal() {
    try {
      var s = snapshot(); s.photoData = state.photoData;
      localStorage.setItem("badgiffa", JSON.stringify(s));
    } catch (e) {}
  }
  async function persist() {
    persistLocal();
    if (!docRef) return;
    try { await docRef.set(snapshot()); }
    catch (e) { say("Couldn't save online. Kept on this device."); }
  }
  function applySaved(s) {
    if (s.name) state.name = s.name;
    if (Array.isArray(s.lines) && s.lines.length) state.lines = s.lines;
    if (s.voiceStyle && VOICES[s.voiceStyle]) state.voiceStyle = s.voiceStyle;
    if (s.fit) state.fit = s.fit;
    if (Array.isArray(s.jawPts) && s.jawPts.length >= 3) state.jawPts = s.jawPts;
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem("badgiffa");
      if (!raw) return;
      var s = JSON.parse(raw);
      applySaved(s);
      if (s.photoData) state.photoData = s.photoData;
    } catch (e) {}
  }

  loadLocal();
  render();

  if (window.claude && window.claude.use) {
    Promise.all([claude.use("db"), claude.use("assets")]).then(function (r) {
      db = r[0]; assets = r[1];
      if (!db) return;
      docRef = db.doc("badgiffa/dog");
      docRef.onSnapshot(function (snap) {
        if (!snap.exists || editing) return;
        var d = snap.data();
        applySaved(d);
        if (d.photoId) { state.photoId = d.photoId; state.photoData = null; }
        if (d.jawPts === null) state.jawPts = null;
        render();
      }, function () {});
    });
  }
})();
</script>
