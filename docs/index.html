<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura Bloom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap">
<style>
  :root {
    --ground: #fbf4f2;
    --ink: #4a2f3a;
    --ink-soft: #8a6b78;
    --petal-tip: #fbe1e8;
    --petal-base: #ec9fb8;
    --petal-edge: #d9779a;
    --stamen: #e6b64c;
    --stamen-tip: #b8324a;
    --heart: #d7e29c;
    --line: #e9cfd7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1f181c;
      --ink: #f3e4ea;
      --ink-soft: #b393a2;
      --petal-tip: #f7d3dd;
      --petal-base: #d8809d;
      --petal-edge: #b45c7c;
      --stamen: #e9c266;
      --stamen-tip: #d8475f;
      --heart: #c9d68a;
      --line: #4a343d;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1f181c;
    --ink: #f3e4ea;
    --ink-soft: #b393a2;
    --petal-tip: #f7d3dd;
    --petal-base: #d8809d;
    --petal-edge: #b45c7c;
    --stamen: #e9c266;
    --stamen-tip: #d8475f;
    --heart: #c9d68a;
    --line: #4a343d;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    margin: 0;
    padding-block: 48px;
    padding-inline: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    overflow: hidden;
    position: relative;
  }
  header { text-align: center; }
  h1 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 0.35em;
    margin: 0 0 6px 0.35em;
    text-wrap: balance;
  }
  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  .bloom {
    width: min(78vw, 460px);
    max-width: 100%;
    aspect-ratio: 1;
    display: block;
  }
  .bloom svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .breathe { transform-origin: 0 0; animation: breathe 7s ease-in-out infinite; }
  .petal { fill: url(#petalFill); stroke: var(--petal-edge); stroke-width: 1.2; stroke-linejoin: round; }
  .vein { stroke: var(--petal-edge); stroke-width: 0.8; fill: none; opacity: 0.45; }
  .filament { stroke: var(--stamen); stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .anther { fill: var(--stamen-tip); }
  .heart { fill: var(--heart); }
  figcaption {
    font-size: 0.95rem;
    color: var(--ink-soft);
    text-align: center;
    max-width: 34ch;
    line-height: 1.6;
    margin: 0 auto;
  }
  figcaption b { font-weight: 400; color: var(--ink); }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  hr { width: 64px; border: 0; border-top: 1px solid var(--line); margin: 0; }
  .drift {
    position: absolute; top: -60px; width: 26px; height: 26px; opacity: 0.7;
    animation: fall linear infinite; pointer-events: none;
  }
  .drift svg { width: 100%; height: 100%; overflow: visible; }
  .drift .petal { stroke-width: 2; }
  @keyframes breathe { 0%,100% { transform: scale(1) rotate(0deg);} 50% { transform: scale(1.025) rotate(1.2deg);} }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(420deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .breathe, .drift { animation: none; }
    .drift { display: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="petalFill" cx="0" cy="0" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--petal-base)"/>
      <stop offset="0.55" stop-color="var(--petal-tip)"/>
      <stop offset="1" stop-color="var(--petal-tip)"/>
    </radialGradient>
    <g id="petal">
      <path class="petal" d="M0 0 C 30 -12, 56 -42, 46 -76 C 41 -93, 20 -103, 9 -92 L 0 -84 L -9 -92 C -20 -103, -41 -93, -46 -76 C -56 -42, -30 -12, 0 0 Z"/>
      <path class="vein" d="M0 -8 C 2 -34, 1 -56, 0 -78"/>
      <path class="vein" d="M0 -14 C 10 -30, 18 -46, 22 -62"/>
      <path class="vein" d="M0 -14 C -10 -30, -18 -46, -22 -62"/>
    </g>
  </defs>
</svg>

<header>
  <p class="eyebrow">Prunus × yedoensis</p>
  <h1>桜</h1>
</header>

<figure>
  <div class="bloom" role="img" aria-label="A single cherry blossom seen face-on: five notched pink petals around a ring of gold stamens with crimson tips.">
    <svg viewBox="-130 -130 260 260">
      <g class="breathe">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
        <g id="stamens"></g>
        <circle class="heart" r="9"/>
      </g>
    </svg>
  </div>
  <hr>
  <figcaption><b>Somei Yoshino.</b> Five petals, each with the notch at the tip that marks a cherry apart from a plum. About 30 stamens, gold filaments, red anthers.</figcaption>
</figure>

<script>
  (function () {
    var ns = "http://www.w3.org/2000/svg";
    var g = document.getElementById("stamens");
    var n = 30;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + ((i % 3) - 1) * 0.05;
      var len = 30 + ((i * 7) % 5) * 4;
      var x = Math.cos(a) * len, y = Math.sin(a) * len;
      var cx = Math.cos(a + 0.18) * len * 0.55, cy = Math.sin(a + 0.18) * len * 0.55;
      var p = document.createElementNS(ns, "path");
      p.setAttribute("class", "filament");
      p.setAttribute("d", "M0 0 Q " + cx.toFixed(1) + " " + cy.toFixed(1) + " " + x.toFixed(1) + " " + y.toFixed(1));
      g.appendChild(p);
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("class", "anther");
      c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", "2.6");
      g.appendChild(c);
    }
    var count = 9;
    for (var k = 0; k < count; k++) {
      var d = document.createElement("div");
      d.className = "drift";
      d.style.left = (5 + (k * 97) % 90) + "vw";
      d.style.animationDuration = (11 + (k * 3) % 8) + "s";
      d.style.animationDelay = (-(k * 2.3)) + "s";
      d.style.transform = "scale(" + (0.6 + (k % 3) * 0.25) + ")";
      d.innerHTML = '<svg viewBox="-60 -110 120 120"><use href="#petal"/></svg>';
      document.body.appendChild(d);
    }
  })();
</script>
</body>
</html>
